<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERARI 007 EARNING - Admin Login</title>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center}.admin-card{width:min(420px,90%);padding:30px;background:rgba(8,8,8,.92);border:1px solid #a97800;border-radius:20px;box-shadow:0 20px 50px #0009}.admin-card img{display:block;width:160px;margin:0 auto 18px}.admin-card h1{text-align:center;color:#ffd21a}.admin-card input{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:10px;border:1px solid #765a12;background:#151515;color:#fff}.admin-card button{width:100%;margin-top:12px}.back{text-align:center;margin-top:15px}.back a{color:#ffd21a}
</style></head><body>
<div class="admin-card"><img src="ferari007_logo.png"><h1>Admin Login</h1>
<input id="aid" placeholder="Admin ID" autocomplete="username">
<input id="apass" type="password" placeholder="Admin Password" autocomplete="current-password">
<button onclick="login()">LOGIN</button><div id="msg" class="back"></div>
<div class="back"><a href="index.html">← Back to Website</a></div></div>
<script>
function login(){const id=document.getElementById('aid').value.trim(),p=document.getElementById('apass').value;
if(id==='admin'&&p==='Admin@12345'){sessionStorage.setItem('adminLogged','1');location.href='admin.html'}
else document.getElementById('msg').textContent='Invalid admin credentials';}
</script></body></html>
